[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "poneke-movement-watch"
version = "0.1.0"
description = "Movement-change signals from WCC Transport Sensors"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "pyarrow>=17,<26",
]

[project.optional-dependencies]
benchmark = [
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
]
test = ["pytest>=8,<10"]

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".notes", ".venv", "artifacts", "data", "site"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
